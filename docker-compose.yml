services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # .env с ноутбука часто содержит 127.0.0.1:8081 — внутри контейнера это не работает.
      TELEGRAM_API_URL: ""
    volumes:
      - downloads:/app/downloads
      - logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  downloads:
  logs:
